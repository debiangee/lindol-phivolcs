services:
  lindol-api:
    build: .
    expose:
      - '3000'
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2.9.1-alpine
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - lindol-api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
